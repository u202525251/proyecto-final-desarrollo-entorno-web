<div class="reservas-container">
  <h1>Buscar y Reservar Sala</h1>

  <!-- Formulario de Detalles -->
  <section class="filters-card">
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div class="filter-group">
        <label>Título de la Reunión</label>
        <input type="text" [(ngModel)]="tituloReunion" placeholder="Ej: Comité de Riesgos">
      </div>
      <div class="filter-group">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="fechaSeleccionada">
      </div>
      <div class="filter-group">
        <label>Hora</label>
        <input type="time" [(ngModel)]="horaSeleccionada">
      </div>
      <div class="filter-group" style="display: flex; align-items: center; gap: 10px; margin-top: 25px;">
        <input type="checkbox" [(ngModel)]="requiereEPP" id="eppCheck">
        <label for="eppCheck">¿Requiere EPP?</label>
      </div>
    </div>
  </section>

  <!-- Grid de Salas (Sincronizado con la imagen de DynamoDB)[cite: 3] -->
  <section class="rooms-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
    <div class="room-card" *ngFor="let sala of salasFiltradas" style="border: 1px solid #ddd; padding: 15px; border-radius: 12px; background: white;">
      <!-- CAMBIO CLAVE: nombre_sala en lugar de nombre -->
      <h3>{{ sala.nombre_sala }}</h3>
      <p><strong>Ubicación:</strong> {{ sala.ubicacion }}</p>
      <p><strong>Capacidad:</strong> {{ sala.capacidad }} personas</p>

      <button 
        class="reserve-btn"
        style="width: 100%; margin-top: 15px; padding: 10px; border-radius: 8px; cursor: pointer;"
        [disabled]="!tituloReunion || !fechaSeleccionada"
        [style.background-color]="(tituloReunion && fechaSeleccionada) ? '#5b2fa0' : '#ccc'"
        [style.color]="'white'"
        (click)="reservarSala(sala)">
        {{ (tituloReunion) ? 'Confirmar en ' + sala.nombre_sala : 'No disponible' }}
      </button>
    </div>
  </section>
</div>
